[filesystem]
data = /var/byro/data
media = /var/byro/data/media
logs = /var/byro/data/logs

[locale]
language_code = de

[site]
debug = True
url = http://localhost

[database]
name = byro
user = byro
password = byro
host = db
port = 5432
engine = postgresql

[mail]
from = admin@localhost
host = localhost
port = 25
user = admin
password = something
tls = False
ssl = True

[oidc]
# Leave issuer url empty to disable OIDC login
issuer_url = https://auth.example.com/application/o/byro/
client_id = byro
client_secret = change-me
# Members of this group get office (admin) access; everyone else is redirected to
# their own member page, matched by the email address stored on their member record.
# Leave empty to grant office access to any authenticated user.
admin_group = byro-admins
# Set to true to automatically create a local account for new OIDC users.
auto_create_account = false
# Claim used as the Django username (default: preferred_username).
username_field = preferred_username
# Require an OIDC login to view member pages: a member page is then only
# accessible with a matching OIDC session (verified email == member email) or an
# office login. The secret token alone is no longer sufficient. Has no effect
# unless OIDC is configured above.
enforce_memberpage_login = false
